[package]
name = "retouch-pro"
version = "1.0.0"
description = "Retouch Pro — AI Portrait & RAW Studio by Collabs Software"
authors = ["Collabs Software"]
edition = "2021"
default-run = "retouch-pro"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
rayon = "1.10"
base64 = "0.22"
rawloader = "0.37"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3


# The icon generator is a developer tool: keep it out of the shipped installers.
[features]
dev-tools = []

[[bin]]
name = "retouch-pro"
path = "src/main.rs"

[[bin]]
name = "make_icons"
path = "src/bin/make_icons.rs"
required-features = ["dev-tools"]
