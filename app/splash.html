<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0E0E10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
      user-select: none;
      -webkit-app-region: drag;
    }
    .splash-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('../Finalsplash.jpg') center/cover no-repeat;
      z-index: 1;
    }
    .overlay-glow {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0) 60%, rgba(14,14,16,0.95) 100%);
      z-index: 2;
    }
    .loader-panel {
      position: relative;
      z-index: 3;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .status-text {
      display: flex;
      justify-content: space-between;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .status-text b {
      color: #FFE606;
      font-weight: 700;
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFE606, #FFF566);
      box-shadow: 0 0 10px #FFE606;
      border-radius: 2px;
      transition: width 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div class="splash-bg"></div>
  <div class="overlay-glow"></div>
  <div class="loader-panel">
    <div class="status-text">
      <span id="splashStatus">Initializing Lightcraft Develop Core & Evoto AI Engine...</span>
      <span id="splashPercent">0%</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="splashBar"></div>
    </div>
  </div>

  <script>
    const stages = [
      { text: "Loading Lightcraft Planckian WB & Tone Engine...", p: 25 },
      { text: "Initializing 8-Band HSL Mixer & 3-Way Split Toning...", p: 55 },
      { text: "Preparing Evoto Frequency Separation & Skin Models...", p: 85 },
      { text: "Launching Collabs Retouch Pro Studio...", p: 100 }
    ];

    let current = 0;
    const bar = document.getElementById('splashBar');
    const status = document.getElementById('splashStatus');
    const percent = document.getElementById('splashPercent');

    function advance() {
      if (current < stages.length) {
        status.textContent = stages[current].text;
        percent.textContent = stages[current].p + "%";
        bar.style.width = stages[current].p + "%";
        current++;
        setTimeout(advance, 750);
      }
    }
    setTimeout(advance, 250);
  </script>
</body>
</html>
